name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build plugin
        run: npm run build

      # Obsidian installs the version named in manifest.json from the release
      # tagged with that exact version, so the two must agree.
      - name: Check manifest version matches the tag
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          manifest="$(node -p "require('./manifest.json').version")"
          if [ "$tag" != "$manifest" ]; then
            echo "Tag $tag does not match manifest.json version $manifest" >&2
            exit 1
          fi

      # The release must be published (not a draft) and carry all three files,
      # or the community plugin validation fails.
      - name: Publish release with plugin assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" main.js manifest.json styles.css \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" main.js manifest.json styles.css \
              --repo "$GITHUB_REPOSITORY" --title "$tag" --generate-notes
          fi
